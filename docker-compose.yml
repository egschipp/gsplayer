services:
  gsplayer:
    image: ${GSPLAYER_IMAGE}
    container_name: gsplayer
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - web

networks:
  web:
    external: true
