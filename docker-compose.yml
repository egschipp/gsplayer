services:
  gsplayer:
    image: ${GSPLAYER_IMAGE}
    container_name: gsplayer
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - web

networks:
  web:
    external: true
