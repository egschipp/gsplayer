name: Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, arm64, pi, gsplayer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm install

      - name: Lint
        if: github.event_name == 'pull_request'
        run: npm run lint

      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: npm run typecheck

      - name: Test
        if: github.event_name == 'pull_request'
        run: npm run test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || node -p "require('./package.json').version")
          DOCKER_BUILDKIT=1 docker build --build-arg NEXT_PUBLIC_APP_VERSION=$APP_VERSION -t ghcr.io/${{ github.repository_owner }}/gsplayer:latest -t ghcr.io/${{ github.repository_owner }}/gsplayer:${{ github.sha }} -f Dockerfile .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/gsplayer:latest
          docker push ghcr.io/${{ github.repository_owner }}/gsplayer:${{ github.sha }}

      - name: Upload docker-compose to Pi
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH || '/opt/gsplayer' }}
          overwrite: true

      - name: Deploy to Raspberry Pi
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GSPLAYER_IMAGE: ghcr.io/${{ github.repository_owner }}/gsplayer:latest
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          CACHE_BACKEND: ${{ secrets.CACHE_BACKEND }}
          CACHE_REDIS_URL: ${{ secrets.CACHE_REDIS_URL }}
          CACHE_REDIS_PREFIX: ${{ secrets.CACHE_REDIS_PREFIX }}
          PORT: ${{ secrets.PORT }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          METRICS_ENABLED: ${{ secrets.METRICS_ENABLED }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: GSPLAYER_IMAGE,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,SPOTIFY_REDIRECT_URI,APP_ENCRYPTION_KEY,DEPLOY_PATH,PORT,LOG_LEVEL,METRICS_ENABLED,CACHE_BACKEND,CACHE_REDIS_URL,CACHE_REDIS_PREFIX,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/gsplayer}"
            mkdir -p "$DEPLOY_PATH"
            if [ -z "${APP_ENCRYPTION_KEY:-}" ]; then
              echo "APP_ENCRYPTION_KEY ontbreekt"
              exit 1
            fi
            if [ "${APP_ENCRYPTION_KEY}" = "openssl rand -base64 32" ]; then
              echo "APP_ENCRYPTION_KEY is ongeldig (voorbeeldtekst)"
              exit 1
            fi
            KEY_LEN=$(echo -n "${APP_ENCRYPTION_KEY}" | python3 - <<'PY'
import base64, sys
v = sys.stdin.read()
try:
    decoded = base64.b64decode(v, validate=True)
    print(len(decoded))
except Exception:
    print(0)
PY
)
            if [ "$KEY_LEN" != "32" ]; then
              echo "APP_ENCRYPTION_KEY moet 32 bytes base64 zijn"
              exit 1
            fi
            cat > "$DEPLOY_PATH/.env" <<EOF
            NODE_ENV=production
            PORT=${PORT:-3000}
            LOG_LEVEL=${LOG_LEVEL:-info}
            METRICS_ENABLED=${METRICS_ENABLED:-true}
            SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
            SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
            SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-}
            APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
            CACHE_BACKEND=${CACHE_BACKEND:-memory}
            CACHE_REDIS_URL=${CACHE_REDIS_URL:-}
            CACHE_REDIS_PREFIX=${CACHE_REDIS_PREFIX:-gsplayer:spotify:}
            GSPLAYER_IMAGE=${GSPLAYER_IMAGE}
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker-compose -f "$DEPLOY_PATH/docker-compose.yml" pull
            docker-compose -f "$DEPLOY_PATH/docker-compose.yml" up -d --remove-orphans
            docker image prune -f
            docker-compose -f "$DEPLOY_PATH/docker-compose.yml" ps
