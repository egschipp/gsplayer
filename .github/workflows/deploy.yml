name: Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, arm64, pi, gsplayer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/gsplayer:latest -t ghcr.io/${{ github.repository_owner }}/gsplayer:${{ github.sha }} -f Dockerfile .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/gsplayer:latest
          docker push ghcr.io/${{ github.repository_owner }}/gsplayer:${{ github.sha }}

      - name: Upload docker-compose to Pi
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH || '/opt/gsplayer' }}
          overwrite: true

      - name: Deploy to Raspberry Pi
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GSPLAYER_IMAGE: ghcr.io/${{ github.repository_owner }}/gsplayer:latest
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          CACHE_BACKEND: ${{ secrets.CACHE_BACKEND }}
          CACHE_REDIS_URL: ${{ secrets.CACHE_REDIS_URL }}
          CACHE_REDIS_PREFIX: ${{ secrets.CACHE_REDIS_PREFIX }}
          PORT: ${{ secrets.PORT }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          METRICS_ENABLED: ${{ secrets.METRICS_ENABLED }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: GSPLAYER_IMAGE,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,DEPLOY_PATH,PORT,LOG_LEVEL,METRICS_ENABLED,CACHE_BACKEND,CACHE_REDIS_URL,CACHE_REDIS_PREFIX,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/gsplayer}"
            mkdir -p "$DEPLOY_PATH"
            cat > "$DEPLOY_PATH/.env" <<EOF
            NODE_ENV=production
            PORT=${PORT:-3000}
            LOG_LEVEL=${LOG_LEVEL:-info}
            METRICS_ENABLED=${METRICS_ENABLED:-true}
            SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
            SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
            CACHE_BACKEND=${CACHE_BACKEND:-memory}
            CACHE_REDIS_URL=${CACHE_REDIS_URL:-}
            CACHE_REDIS_PREFIX=${CACHE_REDIS_PREFIX:-gsplayer:spotify:}
            GSPLAYER_IMAGE=${GSPLAYER_IMAGE}
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker-compose -f "$DEPLOY_PATH/docker-compose.yml" pull
            docker-compose -f "$DEPLOY_PATH/docker-compose.yml" up -d --remove-orphans
            docker image prune -f
            docker-compose -f "$DEPLOY_PATH/docker-compose.yml" ps
